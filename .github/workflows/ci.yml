name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright MCP 0.0.68 bundles its own Playwright; install the matching Chromium revision.
      - run: node "$(dirname "$(pnpm --filter @browserswarm/mcp-browser exec node -p 'require.resolve("playwright/package.json",{paths:[require.resolve("@playwright/mcp/package.json")]})')")/cli.js" install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test # includes the real-MCP fixture integration project
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: /tmp/bs-it-*
          if-no-files-found: ignore
